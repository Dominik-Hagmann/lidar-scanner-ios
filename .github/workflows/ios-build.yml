name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Install XcodeGen
        run: brew install xcodegen cmake
      - uses: actions/cache@v4
        with:
          path: Dependencies/msplat
          key: msplat-xcode16.4-${{ runner.os }}-${{ hashFiles('scripts/prepare-gaussians.sh', 'scripts/patch-engine.py') }}
      - name: Build pinned local Gaussian engine
        run: bash scripts/prepare-gaussians.sh
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build
        run: >-
          xcodebuild
          -project LiDARScanner.xcodeproj
          -scheme LiDARScanner
          -configuration Debug
          -sdk iphonesimulator
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Build Release for iPhone
        run: >-
          xcodebuild -project LiDARScanner.xcodeproj -scheme LiDARScanner
          -configuration Release -sdk iphoneos -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO build
      - name: Test scan records, reports and recovery
        run: bash scripts/test-ios.sh
      - name: Core and export regression tests
        run: bash Tests/run.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-validation
          path: |
            LiDARScanner.xcodeproj
            build/ScanTests.xcresult
            build/screenshots
