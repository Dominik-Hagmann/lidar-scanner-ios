name: LiDARScanner
options:
  developmentLanguage: en
  bundleIdPrefix: at.lidarscanner
  deploymentTarget:
    iOS: "18.0"
packages:
  MetalSplatter:
    url: https://github.com/scier/MetalSplatter.git
    revision: 464eb37c55d90d7362a79120fdf8b50d4ae03296
settings:
  base:
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
    GCC_C_LANGUAGE_STANDARD: "gnu17"
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_VERSION: "5.0"
targets:
  LiDARScanner:
    type: application
    platform: iOS
    sources:
      - path: LiDARScanner
      - path: Dependencies/msplat/swift/Sources/Msplat/Resources/default-ios.metallib
        buildPhase: resources
      - path: Dependencies/msplat/swift/Sources/Msplat/Resources/default-iossimulator.metallib
        buildPhase: resources
    dependencies:
      - framework: Dependencies/msplat/MsplatCore.xcframework
        embed: false
      - package: MetalSplatter
        product: MetalSplatter
      - package: MetalSplatter
        product: SplatIO
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: MetalPerformanceShaders.framework
      - sdk: ImageIO.framework
      - sdk: CoreGraphics.framework
      - sdk: libz.tbd
      - sdk: libc++.tbd
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LiDARScanner/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: at.lidarscanner.scanner
        PRODUCT_NAME: LiDARScanner
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SWIFT_OBJC_BRIDGING_HEADER: LiDARScanner/LiDARScanner-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1,2"
        HEADER_SEARCH_PATHS: ["$(inherited)", "$(SRCROOT)/Dependencies/msplat/core/include"]
    scheme:
      gatherCoverageData: false
      testTargets: [ScanTests, ScanUITests]
  ScanTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/ScanTests]
    dependencies:
      - target: LiDARScanner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: at.lidarscanner.tests
  ScanUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/ScanUITests]
    dependencies:
      - target: LiDARScanner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: at.lidarscanner.uitests
