name: LiDARScanner
options:
  bundleIdPrefix: at.dominikhagmann
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  LiDARScanner:
    type: application
    platform: iOS
    sources:
      - path: LiDARScanner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.dominikhagmann.LiDARScanner
        PRODUCT_NAME: "LiDAR Scanner"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "LiDAR Scanner"
        INFOPLIST_KEY_NSCameraUsageDescription: "LiDAR Scanner requires camera access to capture LiDAR depth and colour information."
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
    scheme:
      gatherCoverageData: false
