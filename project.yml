name: LiDARScanner
options:
  bundleIdPrefix: at.lidarscanner
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    CLANG_CXX_LANGUAGE_STANDARD: "c++17"
    CLANG_CXX_LIBRARY: "libc++"
    GCC_C_LANGUAGE_STANDARD: "gnu17"
    SWIFT_STRICT_CONCURRENCY: minimal
    SWIFT_VERSION: "5.0"
targets:
  LiDARScanner:
    type: application
    platform: iOS
    sources:
      - path: LiDARScanner
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LiDARScanner/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: at.lidarscanner.scanner
        PRODUCT_NAME: LiDARScanner
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SWIFT_OBJC_BRIDGING_HEADER: LiDARScanner/LiDARScanner-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      gatherCoverageData: false
